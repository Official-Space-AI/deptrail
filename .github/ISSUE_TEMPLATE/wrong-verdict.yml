name: Wrong verdict
description: The scan said something about a repository that is not true
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is the report we most want. The exit codes are a contract, and a
        verdict that moves between "absence established" (0) and "could not prove
        absence" (2) is the defect class that matters most here.

        If the wrong verdict involves a credential going somewhere it should not,
        please use [private reporting](https://github.com/Official-Space-AI/deptrail/security/advisories/new)
        instead of this form.
  - type: dropdown
    id: exit
    attributes:
      label: What exit code did you get?
      options:
        - "0 — absence of exposure was established"
        - "1 — credentials to rotate"
        - "2 — looked, and could not prove absence"
        - "3 — the request was malformed"
        - "4 — the tool could not run"
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: What should it have been?
      options:
        - "0 — absence of exposure was established"
        - "1 — credentials to rotate"
        - "2 — looked, and could not prove absence"
        - "3 — the request was malformed"
        - "4 — the tool could not run"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is the verdict wrong?
      description: >
        What exists in the repository that the scan did not account for, or what
        did it hold against the repository that is not true?
      placeholder: >
        The clone was missing release/1.x, which pins the poisoned version inside
        the advisory window. The scan exited 0.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command
      render: shell
      placeholder: deptrail scan --ioc npm-2025-09-08-chalk-debug --repo . --slug acme/api
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report it printed
      description: >
        The caveats and "incomplete view" sections especially — they usually say
        what the scan thought it could not see. Redact anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: What the repository looked like
      description: >
        The parts that matter are usually how it was cloned and what its remotes
        are. If you can, paste the output of these.
      render: shell
      value: |
        git rev-parse --is-shallow-repository
        git config --get-all remote.origin.fetch
        git remote -v
        git for-each-ref --format='%(refname)' | head -20
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: deptrail --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, Python version, git version
      placeholder: "macOS 15.5, Python 3.13.3, git 2.50.1"
    validations:
      required: true
