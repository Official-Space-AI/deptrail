name: Demo
# Proves the evaluator path keeps working: the bundled mock infection must judge
# itself the same way on a clean machine as it does on ours. Assertions run under
# `set -e` so a failed grep fails the job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow checkout cannot answer when a version was installed, and the
          # scanner correctly refuses to call such a repository clean — so the job
          # that judges this repository needs its real history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installed from the checkout the way the README's git+https line does, so
      # what CI proves is what a reader is told to run.
      - run: pip install .
      - name: deptrail demo
        run: |
          set -euo pipefail
          code=0
          deptrail demo --workdir "$RUNNER_TEMP/demo" > demo.txt || code=$?
          test "$code" -eq 1 || { echo "expected exit 1 (rotate), got $code"; exit 1; }
          grep -q "CONFIRMED  ] api-server" demo.txt
          grep -q "LIKELY     ] docs-site" demo.txt
          grep -q "rotate (3 credential(s))" demo.txt
          grep -q "NPM_TOKEN" demo.txt
          # mobile-app is locked with Yarn: named as unread, not cleared, and not
          # turned into a rotation item either.
          grep -q "not judged" demo.txt
          grep -q "mobile-app" demo.txt
          if grep -q "EXPO_TOKEN" demo.txt; then
            echo "an unread tree must not raise a credential"; exit 1
          fi
          # The workflow never reads AWS_ACCESS_KEY, so it must appear nowhere.
          # (`grep -qv` would pass on any single non-matching line — not the same test.)
          if grep -q "AWS_ACCESS_KEY" demo.txt; then
            echo "AWS_ACCESS_KEY must not be on the rotation list"; exit 1
          fi
          {
            echo "## deptrail demo"
            echo '```'
            cat demo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: exit codes are the contract
        # Each command's non-zero exit is the thing under test, so it is captured
        # rather than allowed to abort the step (the default shell runs with -e).
        run: |
          set -uo pipefail
          expect() {
            local want="$1"; shift
            local got=0
            "$@" > /dev/null 2>&1 || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want from: $*  (got $got)"
              exit 1
            fi
          }
          expect 0 deptrail scan --ioc example-demo --repo . --no-ci
          expect 3 deptrail scan --ioc no-such-feed --repo .
          expect 2 deptrail scan --ioc example-demo --repo "$RUNNER_TEMP" --no-ci
          expect 3 deptrail scan --ioc example-demo --org acme --repo .

          # A shallow clone must never read as clean: this is the guard that a
          # default `actions/checkout` (depth 1) would otherwise trip silently.
          git clone --quiet --depth 1 "file://$PWD" "$RUNNER_TEMP/shallow"
          expect 1 deptrail scan --ioc example-demo --repo "$RUNNER_TEMP/shallow" --no-ci
          deptrail scan --ioc example-demo --repo "$RUNNER_TEMP/shallow" --no-ci \
            > shallow.txt || true
          grep -q "shallow clone" shallow.txt
          grep -q "cannot prove absence" shallow.txt

          # A project this version cannot parse must exit 2 — "could not prove
          # absence" — rather than 0, and must not manufacture a rotation list.
          yarn="$RUNNER_TEMP/yarn-project"
          mkdir -p "$yarn" && git -C "$yarn" init -q
          printf '# yarn lockfile v1\n\n"chalk@^5.6.0":\n  version "5.6.1"\n' \
            > "$yarn/yarn.lock"
          git -C "$yarn" add -A
          git -C "$yarn" -c user.email=ci@test -c user.name=ci commit -qm lock
          expect 2 deptrail scan --ioc example-demo --repo "$yarn" --no-ci
          deptrail scan --ioc example-demo --repo "$yarn" --no-ci > yarn.txt || true
          grep -q "not judged" yarn.txt
          grep -q "rotate: nothing" yarn.txt
