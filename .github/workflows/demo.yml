name: Demo
# Proves the evaluator path keeps working: the bundled mock infection must judge
# itself the same way on a clean machine as it does on ours. Assertions run under
# `set -e` so a failed grep fails the job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow checkout cannot answer when a version was installed, and the
          # scanner correctly refuses to call such a repository clean — so the job
          # that judges this repository needs its real history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Installed from the checkout the way the README's git+https line does, so
      # what CI proves is what a reader is told to run.
      - run: pip install .
      - name: deptrail demo
        run: |
          set -euo pipefail
          code=0
          deptrail demo --workdir "$RUNNER_TEMP/demo" > demo.txt || code=$?
          test "$code" -eq 1 || { echo "expected exit 1 (rotate), got $code"; exit 1; }
          grep -q "CONFIRMED  ] api-server" demo.txt
          grep -q "LIKELY     ] docs-site" demo.txt
          grep -q "rotate (3 credential(s))" demo.txt
          grep -q "NPM_TOKEN" demo.txt
          # mobile-app is locked with Yarn: named as unread, not cleared, and not
          # turned into a rotation item either.
          grep -q "not judged" demo.txt
          grep -q "mobile-app" demo.txt
          if grep -q "EXPO_TOKEN" demo.txt; then
            echo "an unread tree must not raise a credential"; exit 1
          fi
          # The workflow never reads AWS_ACCESS_KEY, so it must appear nowhere.
          # (`grep -qv` would pass on any single non-matching line — not the same test.)
          if grep -q "AWS_ACCESS_KEY" demo.txt; then
            echo "AWS_ACCESS_KEY must not be on the rotation list"; exit 1
          fi
          {
            echo "## deptrail demo"
            echo '```'
            cat demo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: exit codes are the contract
        # Each command's non-zero exit is the thing under test, so it is captured
        # rather than allowed to abort the step (the default shell runs with -e).
        run: |
          set -uo pipefail
          expect() {
            local want="$1"; shift
            local got=0
            "$@" > /dev/null 2>&1 || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want from: $*  (got $got)"
              exit 1
            fi
          }
          expect 0 deptrail scan --ioc example-demo --repo . --no-ci
          expect 3 deptrail scan --ioc no-such-feed --repo .
          expect 2 deptrail scan --ioc example-demo --repo "$RUNNER_TEMP" --no-ci
          expect 3 deptrail scan --ioc example-demo --org acme --repo .

          # A shallow clone must never read as clean: this is the guard that a
          # default `actions/checkout` (depth 1) would otherwise trip silently. It
          # exits 2 — "looked and could not prove absence" — and not 1, because
          # deepening a clone must never lower the reported risk.
          git clone --quiet --depth 1 "file://$PWD" "$RUNNER_TEMP/shallow"
          expect 2 deptrail scan --ioc example-demo --repo "$RUNNER_TEMP/shallow" --no-ci
          deptrail scan --ioc example-demo --repo "$RUNNER_TEMP/shallow" --no-ci \
            > shallow.txt || true
          grep -q "shallow clone" shallow.txt
          grep -q "cannot prove absence" shallow.txt
          grep -q "rotate: nothing" shallow.txt
          # The same clone with the gap accepted on purpose clears, and still says so.
          expect 0 deptrail scan --ioc example-demo --repo "$RUNNER_TEMP/shallow" \
            --no-ci --allow-incomplete-history
          deptrail scan --ioc example-demo --repo "$RUNNER_TEMP/shallow" --no-ci \
            --allow-incomplete-history > waived.txt || true
          grep -q "allow-incomplete-history" waived.txt

          # An environment that cannot answer is 4, not 1 and not 3: retrying may help.
          # deptrail's own path is resolved first — stripping PATH before looking it up
          # found no deptrail either, so this asserted 127 and killed every line after it.
          bin="$(command -v deptrail)"
          mkdir -p "$RUNNER_TEMP/nobin"
          expect 4 env PATH="$RUNNER_TEMP/nobin" "$bin" scan --ioc example-demo --org acme
          expect 4 env PATH="$RUNNER_TEMP/nobin" "$bin" scan --ioc example-demo \
            --repo . --slug "$GITHUB_REPOSITORY"

          # A project this version cannot parse must exit 2 — "could not prove
          # absence" — rather than 0, and must not manufacture a rotation list.
          yarn="$RUNNER_TEMP/yarn-project"
          mkdir -p "$yarn" && git -C "$yarn" init -q
          printf '# yarn lockfile v1\n\n"chalk@^5.6.0":\n  version "5.6.1"\n' \
            > "$yarn/yarn.lock"
          git -C "$yarn" add -A
          # Dated inside the bundled advisory's window. A lockfile committed "now"
          # did not exist while the version was installable, and the scanner is right
          # to say nothing about it — which is what this assertion got wrong.
          GIT_AUTHOR_DATE="2025-11-25T10:00:00+00:00" \
          GIT_COMMITTER_DATE="2025-11-25T10:00:00+00:00" \
            git -C "$yarn" -c user.email=ci@test -c user.name=ci commit -qm lock
          expect 2 deptrail scan --ioc example-demo --repo "$yarn" --no-ci
          deptrail scan --ioc example-demo --repo "$yarn" --no-ci > yarn.txt || true
          grep -q "not judged" yarn.txt
          grep -q "rotate: nothing" yarn.txt

  action:
    # The composite action is the interface most users meet, and its exit-code
    # handling is a contract of its own: a scan that could not prove absence must
    # annotate the check rather than pass in silence.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Commit a tree this version cannot read
        # The action always scans the repository it runs in, so the shape under
        # test has to be in that repository's history.
        run: |
          set -euo pipefail
          mkdir -p unreadable
          printf '# yarn lockfile v1\n\n"chalk@^5.6.0":\n  version "5.6.1"\n' \
            > unreadable/yarn.lock
          printf '{"name":"app","dependencies":{"chalk":"^5.6.0"}}\n' \
            > unreadable/package.json
          git add unreadable
          # Inside the bundled advisory's window, for the same reason as above.
          GIT_AUTHOR_DATE="2025-11-25T10:00:00+00:00" \
          GIT_COMMITTER_DATE="2025-11-25T10:00:00+00:00" \
            git -c user.email=ci@test -c user.name=ci commit -qm "an unreadable tree"
      - id: scan
        uses: ./
        with:
          ioc: example-demo
          report: deptrail-report.html
      - name: exit 2 is annotated, not passed over in silence
        run: |
          set -euo pipefail
          code="${{ steps.scan.outputs.exit-code }}"
          test "$code" = "2" || { echo "expected exit 2, got $code"; exit 1; }
      - name: and the report the action was asked for exists
        run: test -s deptrail-report.html
  action-rotate:
    # The other half of the contract: a scan that finds credentials must fail the job
    # by default, and must not fail it under `fail-on: never`. Both were broken by the
    # same inherited errexit, so both need a job.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Commit an exposure in a tree a workflow installs
        run: |
          set -euo pipefail
          mkdir -p app
          printf '%s' '{"name":"app","lockfileVersion":3,"packages":{"":{"dependencies":{"chalk":"^5.6.0"}},"node_modules/chalk":{"version":"5.6.1"}}}' \
            > app/package-lock.json
          git add app
          GIT_AUTHOR_DATE="2025-11-25T10:00:00+00:00" \
          GIT_COMMITTER_DATE="2025-11-25T10:00:00+00:00" \
            git -c user.email=ci@test -c user.name=ci commit -qm "an exposed tree"
      - id: permissive
        uses: ./
        continue-on-error: true
        with:
          ioc: example-demo
          fail-on: never
      - name: fail-on never reports without failing
        run: |
          set -euo pipefail
          test "${{ steps.permissive.outcome }}" = "success" \
            || { echo "fail-on: never must not fail the job"; exit 1; }
          test "${{ steps.permissive.outputs.exit-code }}" = "1" \
            || { echo "expected the scan to find credentials"; exit 1; }
      - id: strict
        uses: ./
        continue-on-error: true
        with:
          ioc: example-demo
      - name: the default fails the job when credentials must be rotated
        run: |
          set -euo pipefail
          test "${{ steps.strict.outcome }}" = "failure" \
            || { echo "the default fail-on must fail on exit 1"; exit 1; }
