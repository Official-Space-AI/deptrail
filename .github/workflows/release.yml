# Publishing is the one action this repository cannot take back: a version number
# on PyPI is spent whether or not the artifact was any good. So the tag only starts
# the run — every claim the release makes is checked here first, and the upload is
# a separate job that cannot begin until those checks pass.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; the two jobs that need more ask for it themselves.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # CI proves main; a tag can be placed on any commit, including one that never
      # passed. Publishing is the step that cannot be undone, so the suite runs again
      # against exactly what is about to be packaged.
      - name: The tagged commit must pass its own tests
        run: |
          python -m pip install --quiet -e ".[dev]"
          pytest -q

      # `build` makes the sdist first and then builds the wheel *from* it, so a wheel
      # that works is also proof the sdist is complete — nobody has to check it twice.
      - name: Build the distributions
        run: |
          python -m pip install --quiet build twine
          python -m build

      # A tag says what was released and the metadata says what was built. Nothing
      # reconciles the two on its own, and a v0.1.1 tag carrying 0.1.0 is unfixable
      # once uploaded, so the mismatch has to stop the run rather than be noticed later.
      - name: The tag and the packaged version must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's|.*/deptrail-(.+)-py3-none-any\.whl|\1|')
          echo "tag=$tag built=$built"
          [ "$tag" = "$built" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${built}"
            exit 1
          }

      # `deptrail demo` is the first command the README gives a reader, and it reads a
      # bundled feed. A wheel that omits the feeds installs cleanly and then fails on
      # that first command, which is the worst way to meet a tool.
      - name: The bundled feeds must be in the wheel
        run: |
          set -euo pipefail
          # Counted against the source tree rather than against 1: "at least one feed"
          # would go on passing after a second feed is added and only the first ships.
          expected=$(ls src/deptrail/feeds/*.json | wc -l | tr -d ' ')
          shipped=$(python -m zipfile -l dist/*.whl | grep -c 'deptrail/feeds/.*\.json') || shipped=0
          echo "feeds: $shipped shipped, $expected in the tree"
          [ "$expected" -ge 1 ] || { echo "::error::no feeds in the source tree"; exit 1; }
          [ "$shipped" = "$expected" ] || {
            echo "::error::the wheel carries $shipped of $expected feeds"; exit 1; }

      - name: The metadata must render on PyPI
        run: twine check --strict dist/*

      # Installed from the wheel, in an environment with nothing else in it — the same
      # position a judge or a responder is in. Testing the source tree instead would
      # pass on a wheel that was packaged wrong.
      - name: The wheel must run where nothing else is installed
        run: |
          set -euo pipefail
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          reported=$(/tmp/fresh/bin/deptrail --version)
          echo "$reported"
          [ "$reported" = "deptrail ${GITHUB_REF_NAME#v}" ] || {
            echo "::error::installed tool reports '$reported'"; exit 1; }
          mkdir -p /tmp/demo && cd /tmp/demo
          set +e
          /tmp/fresh/bin/deptrail demo > demo.txt
          code=$?
          set -e
          cat demo.txt
          # The demo builds a mock infection that must end in a rotation list. Exit 0
          # here would mean the release ships a tool that finds nothing in a repository
          # it was built to catch, and only the exit code says so without reading prose.
          [ "$code" -eq 1 ] || { echo "::error::demo exited $code, expected 1 (rotate)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A deployment environment, so the upload waits on whatever review is configured
    # on it rather than on the tag alone.
    environment:
      name: pypi
      url: https://pypi.org/p/deptrail
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so the
      # repository never holds an API token that could leak or outlive its purpose.
      # A tool whose subject is credential exposure should not be storing one.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned to the commit behind v1.14.2. A moving ref would mean the code that
      # handles this release is not the code that was reviewed for it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  release-notes:
    # Last, and deliberately: PyPI is the artifact that matters, and a failure to
    # draft notes must not look like a failed publish. If this job is the red one,
    # the release is out and only the notes need doing by hand.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
