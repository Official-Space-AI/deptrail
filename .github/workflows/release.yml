# Publishing is the one action this repository cannot take back: a version number
# on PyPI is spent whether or not the artifact was any good, and the filename is
# reserved against re-upload even after a delete. So the tag only starts the run —
# every claim the release makes is checked here first, and the upload is a separate
# job that cannot begin until those checks pass.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; each job asks for exactly what it needs.
permissions: {}

# Deleting and re-pushing a tag is the documented way to retry a failed release,
# and without this the second run can overtake the first at the upload. Note the
# corollary: a run parked at the approval gate holds the slot, so cancel it
# (`gh run cancel <id>`) before re-pushing the same tag or the retry just queues.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ci.yml and demo.yml both trigger only on branches and pull requests, so at
      # tag time nothing else runs at all — this workflow is the only validator. A
      # tag can be placed on any commit, including one that never passed. Note this
      # covers one interpreter on one OS, while the wheel's metadata claims 3.10
      # through 3.13 on any OS; closing that gap is #54.
      - name: The tagged commit must pass its own tests
        run: |
          python -m pip install --quiet -e ".[dev]"
          pytest -q

      # `build` makes the sdist first and then builds the wheel *from* it, so a wheel
      # that works is proof the sdist carries everything the wheel needs. It says
      # nothing about anything only the sdist ships, such as the tests.
      - name: Build the distributions
        run: |
          python -m pip install --quiet build twine
          python -m build

      # A tag says what was released and the metadata says what was built. Nothing
      # reconciles the two on its own, and a v0.1.1 tag carrying 0.1.0 is unfixable
      # once uploaded, so the mismatch has to stop the run rather than be noticed later.
      #
      # This compares the tag to the *normalized* wheel filename, so it is wrong in
      # both directions on its own: it rejects a self-consistent `v0.1.0-rc1` (whose
      # wheel is `0.1.0rc1`), and it accepts `__version__ = "0.1.0.rc1"` under tag
      # `v0.1.0rc1`. The fresh-venv step below compares the tag to the un-normalized
      # constant and is wrong in the opposite direction. The *pair* is sound — do not
      # drop or "simplify" either half. Tags should be written in PEP 440 normal form.
      - name: The tag and the packaged version must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's|.*/deptrail-(.+)-py3-none-any\.whl|\1|')
          echo "tag=$tag built=$built"
          [ "$tag" = "$built" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${built} (PEP 440 normalizes the filename; write the tag in normal form)"
            exit 1
          }

      - name: The bundled feeds must be in the wheel
        run: |
          set -euo pipefail
          # `find`, not `ls src/.../*.json`: the glob makes this step die on an empty
          # feeds directory before the check below can report why, and it counts only
          # the top level while the wheel side matches subdirectories too.
          expected=$(find src/deptrail/feeds -name '*.json' | wc -l | tr -d ' ')
          shipped=$(python -m zipfile -l dist/*.whl | grep -c 'deptrail/feeds/.*\.json') || shipped=0
          echo "feeds: $shipped shipped, $expected in the tree"
          [ "$expected" -ge 1 ] || { echo "::error::no feeds in the source tree"; exit 1; }
          # Counted against the tree rather than against 1: "at least one feed" would
          # go on passing after a second feed is added and only the first ships.
          [ "$shipped" = "$expected" ] || {
            echo "::error::the wheel carries $shipped of $expected feeds"; exit 1; }
          echo "EXPECTED_FEEDS=$expected" >> "$GITHUB_ENV"

      # `skip-existing` on the publish job lets a half-finished upload be retried.
      # The cost is that re-tagging a version already on PyPI would upload nothing and
      # still go green — the dangerous outcome and the benign one would look identical.
      - name: The version must not already be on PyPI
        run: |
          set -uo pipefail
          version="${GITHUB_REF_NAME#v}"
          published=$(curl -sf https://pypi.org/pypi/deptrail/json |
            python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["releases"]))') || {
              echo "::warning::could not ask PyPI which versions exist (the project may not exist yet); skip-existing keeps the upload itself safe"
              exit 0
            }
          if printf '%s\n' "$published" | grep -qxF "$version"; then
            echo "::error::$version is already on PyPI — bump the version instead of re-tagging"
            exit 1
          fi
          echo "$version is not on PyPI yet"

      - name: The metadata must be well formed
        # Validates the metadata. It does *not* ask PyPI whether the version is
        # acceptable — a local version like 0.1.0+x passes here and is rejected at
        # upload — and, despite its name, it does not render this project's README
        # either. See the next step.
        run: twine check --strict dist/*

      # `twine check` maps text/markdown to no renderer at all
      # (twine/commands/check.py: `"text/markdown": None  # Rendering cannot fail`),
      # so on a markdown README it passes while proving nothing. It printed PASSED
      # here with no markdown backend installed at all. The description *is* the
      # pypi.org project page, and PyPI freezes it at upload — a broken one cannot be
      # edited afterwards, only superseded by another release. So render it here with
      # the library warehouse itself uses, against the artifact about to be uploaded.
      - name: The project page must render, and its links must work off GitHub
        run: |
          set -euo pipefail
          python -m pip install --quiet "readme_renderer[md]"
          python - <<'PY'
          import email, glob, sys, zipfile
          from html.parser import HTMLParser
          import readme_renderer.markdown as md

          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              # Decoded by hand. METADATA carries no charset, so email's compat32
              # parser falls back to ASCII with errors="replace" — 634 U+FFFD on this
              # project, swallowing every em dash, both check marks, and the entire
              # Korean section. The gate was proving that mojibake renders.
              meta = email.message_from_string(z.read(name).decode("utf-8"))

          ctype = meta.get("Description-Content-Type", "")
          if "markdown" not in ctype:
              sys.exit(f"::error::unexpected description content type: {ctype!r}")

          html = md.render(meta.get_payload(), variant="GFM")
          if not html:
              sys.exit("::error::the description does not render as markdown")


          class Targets(HTMLParser):
              """Parsed rather than pattern-matched.

              A regex over the rendered HTML flags an `href` written inside an inline
              code span, which is text and not a link, and misses `src` on an image
              entirely — so a local screenshot would freeze onto the page permanently
              broken, which is the exact failure this step exists to prevent.
              """

              ABSOLUTE = ("http://", "https://", "mailto:", "//", "#", "data:")

              def __init__(self):
                  super().__init__()
                  self.dead = set()

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("href", "src") and value:
                          if not value.lower().startswith(self.ABSOLUTE):
                              self.dead.add(value)


          # Relative targets resolve against pypi.org, where these paths do not exist.
          # They look correct on GitHub, which is the only place an author sees them.
          found = Targets()
          found.feed(html)
          if found.dead:
              sys.exit("::error::targets dead on PyPI: " + ", ".join(sorted(found.dead)))

          print(f"description renders: {len(html)} chars, no relative targets")
          PY

      # Installed from the wheel, in an environment with nothing else in it — the same
      # position a judge or a responder is in. Testing the source tree instead would
      # pass on a wheel that was packaged wrong, which is the failure this catches.
      - name: The wheel must run where nothing else is installed
        run: |
          set -euo pipefail
          python -m venv /tmp/fresh
          # --no-deps --no-index: "nothing else installed" is the claim, and today it
          # holds only because this package happens to have no dependencies.
          /tmp/fresh/bin/pip install --quiet --no-deps --no-index dist/*.whl

          reported=$(/tmp/fresh/bin/deptrail --version)
          echo "$reported"
          [ "$reported" = "deptrail ${GITHUB_REF_NAME#v}" ] || {
            echo "::error::installed tool reports '$reported'"; exit 1; }

          # Opens every bundled feed. The step above compares filenames, and a filename
          # cannot tell a feed from a truncated file: a wheel whose feed was cut mid-JSON
          # passed every other gate here while `deptrail feeds` raised for every user.
          listed=$(/tmp/fresh/bin/deptrail feeds | wc -l | tr -d ' ')
          [ "$listed" = "$EXPECTED_FEEDS" ] || {
            echo "::error::deptrail feeds listed $listed of $EXPECTED_FEEDS"; exit 1; }

          cd "$RUNNER_TEMP"
          code=0
          /tmp/fresh/bin/deptrail demo > demo.txt || code=$?
          cat demo.txt
          # The demo builds a mock infection that must end in a rotation list, and 1 is
          # this tool's "credentials to rotate".
          [ "$code" -eq 1 ] || { echo "::error::demo exited $code, expected 1 (rotate)"; exit 1; }
          # But the exit code alone is not proof of anything: Python also exits 1 for an
          # uncaught exception, so a demo that crashed before printing a byte used to
          # pass this gate green. These are the assertions demo.yml already makes on
          # every push — and demo.yml does not trigger on tags, so at release time
          # nothing else makes them.
          grep -q "CONFIRMED  ] api-server" demo.txt
          grep -q "LIKELY     ] docs-site" demo.txt
          grep -q "rotate (3 credential(s))" demo.txt
          grep -q "NPM_TOKEN" demo.txt
          # An unread tree is named as unread, not cleared and not turned into a
          # rotation item.
          grep -q "not judged" demo.txt
          grep -q "mobile-app" demo.txt
          if grep -q "AWS_ACCESS_KEY" demo.txt; then
            echo "::error::a credential the workflow never reads must not be listed"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # Without these an empty dist/ is a green step and a baffling failure in the
          # next job, and a re-run after a failed publish collides with its own artifact.
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Referencing an environment creates it with *no* protection rules, so on its own
    # this gates nothing: the real precondition is "someone with push access pushed a
    # v* tag". Configure required reviewers and a `v*` deployment tag rule on the
    # `pypi` environment to make it a control.
    environment:
      name: pypi
      url: https://pypi.org/p/deptrail
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so the
      # repository never holds an API token that could leak or outlive its purpose.
      # A tool whose subject is credential exposure should not be storing one.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned to the commit behind v1.14.2. A moving ref would mean the code that
      # handles this release is not the code that was reviewed for it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          # dist/ holds two files and they upload one at a time. If the sdist lands and
          # the wheel then fails, the default (false) makes every retry die on "File
          # already exists" before it reaches the wheel — and PyPI reserves that
          # filename even if the file is deleted, so 0.1.0 could never be completed.
          # With this, a retry uploads only what is missing.
          skip-existing: true

  release-notes:
    # Last, and deliberately: PyPI is the artifact that matters, and a failure to
    # publish notes must not look like a failed publish. If this job is the red one,
    # the release is out and only the notes need doing by hand.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
