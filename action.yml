name: deptrail scan
description: >-
  Judge whether this repository installed a compromised package during an
  advisory's window, and which credentials that puts at risk.
inputs:
  ioc:
    description: Advisory file path in this repository, or a bundled feed name.
    required: true
  fail-on:
    description: >-
      When to fail the job: "rotate" (credentials to rotate), "incomplete"
      (also when the scan cannot prove absence), or "never".
    required: false
    default: rotate
  report:
    description: Path to write an HTML report to; skipped when empty.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # A shallow checkout cannot answer when a version was installed, so the
    # action fetches the full history rather than reporting a clean it cannot know.
    - name: Deepen history
      shell: bash
      run: git fetch --prune --unshallow || git fetch --prune
    - name: Install deptrail
      shell: bash
      run: pip install --quiet deptrail
    - name: Scan
      id: scan
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        deptrail scan --ioc "${{ inputs.ioc }}" --repo . --format text | tee scan.txt
        code=${PIPESTATUS[0]}
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        { echo '## deptrail'; echo '```'; cat scan.txt; echo '```'; } \
          >> "$GITHUB_STEP_SUMMARY"
        if [ -n "${{ inputs.report }}" ]; then
          deptrail scan --ioc "${{ inputs.ioc }}" --repo . --format html \
            --output "${{ inputs.report }}"
        fi
        case "${{ inputs.fail-on }}" in
          never) exit 0 ;;
          incomplete) [ "$code" -eq 0 ] && exit 0 || exit 1 ;;
          *) [ "$code" -eq 1 ] && exit 1 || exit 0 ;;
        esac
