name: deptrail scan
description: >-
  Judge whether this repository installed a compromised package during an
  advisory's window, and which credentials that puts at risk.
inputs:
  ioc:
    description: Advisory file path in this repository, or a bundled feed name.
    required: true
  fail-on:
    description: >-
      When to fail the job: "rotate" (credentials to rotate, plus any bad input),
      "incomplete" (also when the scan cannot prove absence), or "never" (report
      only; bad input still fails, because a scan that never ran is not a pass).
    required: false
    default: rotate
  report:
    description: Path to write an HTML report to; skipped when empty.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The action installs the version it was pinned to, so the workflow's ref and
    # the code that runs can never drift apart.
    - name: Install deptrail
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install --quiet "$ACTION_PATH"
    # A shallow checkout cannot answer when a version was installed, so the action
    # deepens the history rather than reporting a clean it cannot know.
    - name: Deepen history
      shell: bash
      run: git fetch --prune --unshallow --quiet || git fetch --prune --quiet || true
    - name: Scan
      id: scan
      shell: bash
      env:
        # Inputs travel through the environment: interpolating them into the
        # script would let a quote in an input run arbitrary commands.
        IOC: ${{ inputs.ioc }}
        FAIL_ON: ${{ inputs.fail-on }}
        REPORT: ${{ inputs.report }}
        SLUG: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        case "$FAIL_ON" in
          rotate|incomplete|never) ;;
          *) echo "::error::unknown fail-on value: $FAIL_ON"; exit 1 ;;
        esac

        deptrail scan --ioc "$IOC" --repo . --slug "$SLUG" --format text | tee scan.txt
        code=${PIPESTATUS[0]}
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        {
          echo "## deptrail"
          echo '```'
          cat scan.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -n "$REPORT" ]; then
          deptrail scan --ioc "$IOC" --repo . --slug "$SLUG" --format html \
            --output "$REPORT" || { echo "::error::report generation failed"; exit 1; }
        fi

        # A scan that never ran (3) fails regardless of fail-on: a green check must
        # never mean "we could not look".
        case "$code" in
          3) echo "::error::deptrail could not run: see the log"; exit 1 ;;
          1) [ "$FAIL_ON" = never ] && exit 0 || { echo "::error::credentials to rotate"; exit 1 ;} ;;
          # A scan that could not prove absence is only a failure when asked for,
          # but it is never silent: the annotation says so on the check itself,
          # because nobody opens the log of a green run.
          2) [ "$FAIL_ON" = incomplete ] && { echo "::error::scan could not prove absence"; exit 1 ;} \
               || { echo "::warning::deptrail could not prove absence of exposure: see the job summary"; exit 0 ;} ;;
          0) exit 0 ;;
          *) echo "::error::unexpected exit code $code"; exit 1 ;;
        esac
