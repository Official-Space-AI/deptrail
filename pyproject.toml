[build-system]
# Floor, not decoration: 1.26.x builds without error and silently emits the legacy
# free-text `License:` field instead of `License-Expression`, and loses the
# `License-File` field although the file itself still ships — measured. An
# Apache-2.0 security tool whose license metadata quietly degrades is exactly the
# artifact an SPDX-aware scanner then reads wrong.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deptrail"
# Read from src/deptrail/__init__.py by [tool.hatch.version] below, so the wheel and
# the running tool cannot disagree about what code produced a report. The *tag* is a
# separate claim, reconciled by a gate in .github/workflows/release.yml, not here.
dynamic = ["version"]
description = "Time-axis forensics for npm supply-chain incidents: did we install it, did it run, what must be rotated"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Official-Space-AI" }]
keywords = ["security", "supply-chain", "npm", "forensics", "incident-response", "lockfile", "ioc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  # Earned rather than assumed: CI runs the suite on Linux, macOS and Windows.
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  # CI tests the ends of the supported range, 3.10 and 3.13.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
deptrail = "deptrail.cli:main"

[project.optional-dependencies]
# PyYAML is here and nowhere else on purpose. src/deptrail/yamlsubset.py reads the YAML
# that pnpm and Yarn Berry lockfiles are written in, and the argument for writing that
# reader instead of depending on one is that a supply-chain forensics tool should not
# carry a supply-chain dependency. What replaces the dependency is a measurement: the
# suite parses real lockfiles both ways and fails on any disagreement the reader did not
# announce. A test guard asserts that importing deptrail never imports yaml.
dev = ["pytest", "PyYAML"]

[project.urls]
Homepage = "https://github.com/Official-Space-AI/deptrail"
Repository = "https://github.com/Official-Space-AI/deptrail"
Documentation = "https://github.com/Official-Space-AI/deptrail#readme"
Issues = "https://github.com/Official-Space-AI/deptrail/issues"
Changelog = "https://github.com/Official-Space-AI/deptrail/releases"

[tool.hatch.version]
path = "src/deptrail/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/deptrail"]
artifacts = ["src/deptrail/feeds/*.json"]
